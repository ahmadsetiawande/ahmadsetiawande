name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"   # jalan otomatis tiap tengah malam UTC
  workflow_dispatch: {}     # supaya bisa dijalankan manual dari tab Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ahmadsetiawande
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FFD700&color_dots=#1a1a1a,#0e4429,#26a641,#39d353,#39ff14&color_background=#0D1117
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FFD700&color_dots=#1a1a1a,#0e4429,#26a641,#39d353,#39ff14&color_background=#0D1117

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
